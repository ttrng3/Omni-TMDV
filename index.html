<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#F2F2F7;color:#1C1C1E}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<title>TMDV Điều hành</title>
<style>
/* ============================================================
   BASE SHEET — Apple HIG light tokens. Materials: see #apple-layer below. Light only.
   Replaces the warm-paper / Playfair treatment, 2026-09-23.
   System font only: no webfont link, nothing to block render.
   Markup and the data layer are untouched — this file is style only.
   ============================================================ */
:root{
  --bg:#F2F2F7;          /* page ground */
  --card:#FFFFFF;        /* cards, containers */
  --sunk:#F2F2F7;        /* wells, code, neutral fills */
  --line:#E5E5EA;        /* hairline */
  --line-soft:#EFEFF2;   /* row rule inside a card */

  --ink:#1C1C1E;         /* primary: conclusions, figures */
  --ink-soft:#3C3C43;    /* body prose */
  --muted:#8E8E93;       /* captions, labels, sources */

  --blue:#007AFF;   --blue-bg:#E0EFFF;   --blue-ink:#0040DD;  --blue-line:#CCE4FF;
  --accent:#007AFF; --accent-soft:#E0EFFF; --accent-line:#CCE4FF; --accent-deep:#0040DD;
  --green:#34C759;  --green-bg:#E7F8EB;  --green-ink:#1E7F3C;  --green-line:#D6F4DE;
  --warning:#8A5200; --warning-soft:#FFF2E0; --warning-line:#FFEACC; --amber:#FF9500;
  --critical:#D70015; --critical-soft:#FFE7E6; --critical-line:#FFD8D6; --red:#FF3B30;

  --r-card:12px; --r-inner:8px; --r-pill:12px;
  --sans:-apple-system,BlinkMacSystemFont,"San Francisco","Helvetica Neue",Helvetica,Ubuntu,Roboto,sans-serif;
  --serif:var(--sans);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink-soft);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:32px 64px}

/* ---------- Type ---------- */
h1,h2,h3,h4{margin:0;color:var(--ink);text-wrap:balance;font-family:var(--sans)}
h1{font-size:28px;font-weight:600;line-height:1.2;letter-spacing:-.021em}
h2{font-size:20px;font-weight:500;line-height:1.3;letter-spacing:-.012em;margin-top:40px;padding-top:0;border-top:0;display:flex;align-items:baseline;gap:10px}
h2 .k{font-family:var(--mono);font-size:12px;font-weight:600;font-style:normal;color:var(--blue-ink);background:var(--blue-bg);border-radius:6px;padding:2px 7px;letter-spacing:.02em;line-height:1.4}
h3{font-size:16px;font-weight:600;margin-top:24px;letter-spacing:-.005em;line-height:1.35}
h4{font-size:14px;font-weight:600;letter-spacing:0}
p{margin:0 0 12px;max-width:72ch}
p:last-child{margin-bottom:0}
strong,b{color:var(--ink);font-weight:600}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.lead{font-size:15px;color:var(--ink-soft);max-width:74ch;line-height:1.55}
.eyebrow{font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.num,.n{font-variant-numeric:tabular-nums}
code{font-family:var(--mono);font-size:.92em;background:var(--sunk);border-radius:4px;padding:1px 5px;color:var(--ink)}

/* ---------- Masthead ---------- */
.hdr{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid var(--line)}
.hdr > div:first-child{flex:1 1 440px;min-width:0}
.hdr .meta{flex:0 1 auto}
.hdr h1{margin:8px 0 10px}
.hdr .meta{font-size:12px;color:var(--muted);line-height:1.6;text-align:right;max-width:52ch}
.hdr .meta details{margin-top:4px;border:0;padding:0}
.hdr .meta summary{cursor:pointer;list-style:none;color:var(--blue);font-size:12px;font-weight:600;letter-spacing:0;display:inline}
.hdr .meta summary::-webkit-details-marker{display:none}
.hdr .meta summary::after{content:" +"}
.hdr .meta details[open] summary::after{content:" \2013"}
.hdr .meta .more{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);line-height:1.6}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:2px;margin:24px 0 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 16px 11px;font:inherit;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;margin-bottom:-1px;transition:color .15s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--blue);border-bottom-color:var(--blue)}
.tab:focus-visible{outline:2px solid var(--blue);outline-offset:-2px;border-radius:6px}
.tab .hint{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.panel{padding-top:4px}

/* ---------- Verdict ---------- */
.verdict{margin:24px 0 0;padding:20px 24px;border:1px solid var(--blue-line);border-left:1px solid var(--blue-line);background:var(--blue-bg);border-radius:var(--r-card);box-shadow:none}
.verdict h2{font-size:20px;font-weight:600;line-height:1.3;margin:0;padding:0;border:0;display:block;letter-spacing:-.012em}
.verdict p{max-width:none;color:var(--ink-soft);margin:10px 0 0;font-size:14px}

/* ---------- KPI tiles ---------- */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.kpi{padding:16px 20px 18px;background:var(--card);border:1px solid var(--line);border-top:1px solid var(--line);border-radius:var(--r-card);box-shadow:none}
.kpi .v{font-family:var(--sans);font-size:30px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--ink)}
.kpi .l{font-size:13px;color:var(--ink-soft);margin-top:8px;line-height:1.4}
.kpi .s{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
.kpi.crit .v{color:var(--critical)}
.kpi.warn .v{color:var(--warning)}

/* Trust tags. `.pv.pv`, never `.pv`: inside a KPI card `.kpi .v` / `.kpi .l`
   would otherwise win on specificity and blow a 12px tag up to a 30px figure.
   Do not simplify these back to a single class. */
.pv.pv{display:inline-block;font-family:var(--sans);font-size:11px;font-weight:600;padding:1px 6px;border-radius:var(--r-pill);border:0;vertical-align:1px;white-space:nowrap;margin-left:4px;background:var(--sunk);color:var(--muted);line-height:1.5;letter-spacing:0}
.pv.pv.v{color:var(--green-ink);background:var(--green-bg)}
.pv.pv.a{color:var(--warning);background:var(--warning-soft)}
.pv.pv.l{color:var(--muted);background:var(--sunk)}
.provkey{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:12px;color:var(--muted)}

/* ---------- Trend ---------- */
.trend{margin-top:20px;border:1px solid var(--line);border-radius:var(--r-card);background:var(--card);box-shadow:none;overflow:hidden}
.trend .th{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 20px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.trend .th h3{font-size:16px;margin:0}
.trend .th .sub{font-size:12px;color:var(--muted)}
.trend table{font-size:13px;min-width:0}
.trend .tw{margin:0;border:0;border-radius:0;box-shadow:none;background:none}
.trend th,.trend td{padding:9px 20px;border-bottom:1px solid var(--line-soft)}
.trend th{background:none;font-size:12px}
.trend td.m{color:var(--ink-soft);white-space:nowrap}
.trend td.m.sub{padding-left:34px;color:var(--muted);font-size:12px}
.trend tr.lead td{font-weight:600;color:var(--ink)}
.trend td.p{text-align:right;font-family:var(--sans);font-variant-numeric:tabular-nums;white-space:nowrap}
.trend td.now{background:var(--blue-bg)}
.trend td.d{text-align:right;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.trend td.d.flat,.trend td.flat{color:var(--muted)}
.trend td.d.up{color:var(--green-ink)}
.trend td.d.basis{color:var(--warning)}
.trend .tnote{margin:0;padding:12px 20px 14px;font-size:12px;color:var(--muted);line-height:1.55;max-width:none;border:0}

/* ---------- Instrument trust ---------- */
.unsafe{margin-top:20px;border:1px solid var(--critical-line);border-left:1px solid var(--critical-line);border-radius:var(--r-card);background:var(--critical-soft);padding:16px 20px 14px}
.unsafe h3{font-size:13px;margin:0 0 4px;color:var(--critical);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.unsafe ol{margin:8px 0 0;padding-left:20px}
.unsafe li{font-size:13px;color:var(--ink-soft);margin:6px 0;line-height:1.5}
.unsafe .where{font-size:12px;color:var(--muted);margin-left:4px}

/* ---------- Pillars ---------- */
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
/* A panel file once shipped the wrapper twice (<div class=pillars><div class=pillars>…),
   which dropped all four cards into column 1. Flatten any nested wrapper so the
   cards always sit in the outer grid, whatever the data writes. */
.pillars>.pillars{display:contents}
.pil{border:1px solid var(--line);background:var(--card);padding:20px 22px;border-radius:var(--r-card);box-shadow:none}
.pil .top{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.pil h3{margin:0;font-size:16px;font-weight:600}
.pil .tag{font-size:12px;color:var(--muted)}
.pil .big{font-family:var(--sans);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:10px;letter-spacing:-.02em;color:var(--ink);display:flex;flex-wrap:wrap;align-items:baseline;column-gap:6px;row-gap:5px;line-height:1.15}
.pil .big small{font-size:12px;color:var(--muted);font-weight:400;letter-spacing:0;order:1;flex-basis:100%;line-height:1.5}
.pil ul{margin:14px 0 0;padding-left:18px}
.pil li{margin:7px 0;font-size:13px;color:var(--ink-soft)}
.pil .fresh{font-size:12px;color:var(--muted);margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.pil.crit,.pil.warn,.pil.ok{border-top:1px solid var(--line)}
.pil.crit h3{color:var(--critical)}
.pil.warn h3{color:var(--warning)}

/* ---------- Occupancy bar ---------- */
.barrow{margin-top:18px}
.barrow .lab{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;color:var(--ink-soft)}
.bar{display:flex;gap:2px;height:30px;border:0;border-radius:var(--r-inner);overflow:hidden;box-shadow:none;background:var(--sunk)}
.seg{display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);overflow:hidden;border-right:0}
.seg span{white-space:nowrap}
.b-live{background:var(--green);color:#FFFFFF}
.b-live span{color:#FFFFFF}
.b-signed{background:var(--blue);color:#FFFFFF}
.b-signed span{color:#FFFFFF}
.b-locked{background:#A6D0FF;color:var(--ink)}
.b-int{background:var(--amber);color:#FFFFFF}
.b-int span{color:#FFFFFF}
.b-neg{background:#FFDAA6;color:var(--ink)}
.b-vac{background:#FFBAB7;color:var(--critical)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:12px;color:var(--muted)}
.lg{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border:0;display:inline-block;border-radius:3px}

/* ---------- Stages ---------- */
.stages{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:16px}
.stage{border:1px solid var(--line);padding:14px 16px;background:var(--card);border-radius:var(--r-inner);box-shadow:none}
.stage .t{font-weight:600;font-size:13px;color:var(--ink)}
.stage .d{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4}
.stage .c{font-family:var(--sans);font-size:12px;margin-top:10px;color:var(--ink-soft);line-height:1.5;font-variant-numeric:tabular-nums}
.stage.hi{border-color:var(--critical-line);background:var(--critical-soft)}

/* ---------- Tables ---------- */
.tw{overflow-x:auto;margin-top:16px;border:1px solid var(--line);border-radius:var(--r-card);box-shadow:none;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:11px 16px;text-align:left;vertical-align:top;border:0;border-bottom:1px solid var(--line-soft)}
th{background:none;font-weight:600;font-size:12px;color:var(--muted);white-space:nowrap;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line)}
td{color:var(--ink-soft)}
td strong{color:var(--ink)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
.sub{font-size:12px;color:var(--muted);margin-top:3px}
td.proj{white-space:nowrap;font-family:var(--sans);font-size:13px;font-weight:600;color:var(--ink)}
td.risk{min-width:300px}

/* ---------- Status pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border:0;border-radius:var(--r-pill);white-space:nowrap;line-height:1.5;background:var(--sunk);color:var(--muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.st-crit{color:var(--critical);background:var(--critical-soft)}
.st-warn{color:var(--warning);background:var(--warning-soft)}
.st-ok{color:var(--green-ink);background:var(--green-bg)}
.st-neg{color:var(--blue-ink);background:var(--blue-bg)}
.st-info{color:var(--muted);background:var(--sunk)}
.dl-over{color:var(--critical);font-weight:600}

/* ---------- Money cards ---------- */
.xd{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.xd .c{border:1px solid var(--line);padding:20px 22px;border-radius:var(--r-card);background:var(--card);box-shadow:none}
.xd .c .money{font-family:var(--sans);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--ink);line-height:1.2}
.xd .c .money small{font-size:13px;color:var(--muted);margin-left:8px;font-weight:400;letter-spacing:0}
.xd .c h4{margin-top:10px;font-size:15px}
.xd .c p{font-size:13px;max-width:none;color:var(--ink-soft);margin:8px 0 0}
.owner{font-size:12px;color:var(--muted);margin-top:12px}
.sev{font-size:12px;font-weight:600}
.sev.h{color:var(--critical)}
.sev.m{color:var(--warning)}

/* ---------- Disclosure ---------- */
details.acc{border:1px solid var(--line);margin-top:12px;background:var(--card);border-radius:var(--r-card);box-shadow:none;overflow:hidden}
details.acc summary{cursor:pointer;padding:14px 20px;font-weight:600;font-size:14px;color:var(--ink);list-style:none;display:flex;justify-content:flex-start;gap:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;align-items:center}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary .r{font-weight:400;color:var(--muted);font-size:12px;font-family:var(--sans);margin-left:auto;padding-left:12px}
details.acc summary::before{content:"";width:0;height:0;border-left:5px solid var(--blue);border-top:4px solid transparent;border-bottom:4px solid transparent;margin-right:10px;flex:none;transition:transform .15s ease}
details.acc[open] summary::before{transform:rotate(90deg)}
details.acc[open] summary{border-bottom:1px solid var(--line)}
details.acc .body{padding:16px 20px 20px}
details.acc .body .tw{border:1px solid var(--line);box-shadow:none;background:none}
.note{font-size:12px;color:var(--muted);margin-top:12px;max-width:80ch;line-height:1.55}

/* ---------- Callouts ---------- */
.callout{border:1px solid var(--warning-line);border-left:1px solid var(--warning-line);padding:16px 20px;margin-top:16px;background:var(--warning-soft);border-radius:var(--r-card)}
.callout.crit{border-color:var(--critical-line);background:var(--critical-soft)}
.callout.ok{border-color:var(--green-line);background:var(--green-bg)}
.callout p{max-width:none;margin:4px 0;font-size:13px;color:var(--ink)}

/* ---------- Timeline ---------- */
.tl{margin-top:16px;border:1px solid var(--line);border-radius:var(--r-card);background:var(--card);padding:4px 20px}
.tlrow{display:grid;grid-template-columns:82px 14px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-soft);align-items:start}
.tlrow:last-child{border-bottom:0}
.tlrow .dt{font-size:12px;color:var(--muted);text-align:right;padding-right:4px;font-variant-numeric:tabular-nums;padding-top:2px}
.tlrow .dot{width:9px;height:9px;border-radius:50%;margin-top:7px;margin-left:0;border:0}
.tlrow .body{font-size:13px;color:var(--ink-soft)}
.tlrow .body .cat{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-left:8px;font-weight:600}
.d-legal{background:var(--red)}
.d-recover{background:var(--amber)}
.d-lease{background:var(--green)}
.d-otl{background:var(--blue)}
.d-policy{background:var(--muted)}
.d-budget{background:#5856D6}
.d-land{background:#AF52DE}
.tlkey{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:12px;color:var(--muted)}
.tlkey .lg .sw{border-radius:50%;width:9px;height:9px}

/* ---------- Governance ---------- */
.gov{display:grid;grid-template-columns:1fr;margin-top:16px;border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;box-shadow:none;background:var(--card)}
.govrow{display:grid;grid-template-columns:200px 96px 1fr;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line-soft);align-items:baseline}
.govrow:last-child{border-bottom:0}
.govrow .g-name{font-weight:600;font-size:13px;color:var(--ink)}
.govrow .g-txt{font-size:13px;color:var(--ink-soft)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.foot{margin-top:48px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.foot p{max-width:none;line-height:1.6}

@media (max-width:900px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .pillars{grid-template-columns:repeat(2,1fr)}
  .xd,.two{grid-template-columns:1fr}
  .stages{grid-template-columns:repeat(3,1fr)}
  .hdr .meta{text-align:left}
  .govrow{grid-template-columns:1fr;gap:4px}
}
@media (max-width:560px){
  .kpis{grid-template-columns:1fr}
  .pillars{grid-template-columns:1fr}
  .stages{grid-template-columns:1fr}
  .tlrow{grid-template-columns:66px 14px 1fr}
  h1{font-size:24px}
  .wrap{padding-block:24px 48px}
  .kpi,.pil,.xd .c,.verdict{padding:16px}
  .tl{padding:4px 16px}
  th,td{padding:10px 12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Print: this gets photocopied ---------- */
@media print{
  body{background:#FFFFFF;font-size:11pt}
  :root{--muted:#222;--ink-soft:#222;--bg:#FFFFFF;--card:#FFFFFF;--line:#BBBBBB;--line-soft:#DDDDDD}
  .wrap{padding:0;max-width:none}
  .tabs{display:none}
  .panel[hidden]{display:block!important}
  .hdr .meta details{display:block}
  .hdr .meta summary{display:none}
  .hdr .meta .more{display:block!important}
  .verdict,.kpi,.pil,.stage,.tw,.xd .c,details.acc,.gov,.bar,.trend,.tl{box-shadow:none!important}
  .kpi,.stage,.pil,.xd .c,.callout,.verdict,.unsafe,th,.trend td.now{background:#FFFFFF!important}
  .kpi,.stage,.pil,.xd .c,details.acc,.callout,.verdict,.tlrow,.govrow,tr,.trend,.unsafe{break-inside:avoid}
  h2,h3{break-after:avoid}
  .pill,.pv.pv{background:#FFFFFF!important;color:#222!important;border:1px solid #777}
  details.acc{border:1px solid #999}
  details.acc summary::before{content:none;border:0;margin:0}
  details.acc summary{color:#222!important}
  .seg,.dot,.sw,.b-live,.b-int,.b-signed,.b-locked,.b-neg,.b-vac,.d-legal,.d-recover,.d-lease,.d-otl,.d-policy,.d-budget,.d-land{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  a{color:inherit;text-decoration:none}
}
</style>
<style id="apple-layer">
/* ============================================================
   APPLE LAYER — apple-design skill (emilkowalski/skills), 2026-09-24.
   Additive: sits after the base sheet and only overrides.
   LIGHT ONLY (Ty, 2026-09-24): no dark theme — do not add one.
   ============================================================ */
:root{color-scheme:light;
  --shadow-card:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);
  --shadow-float:0 1px 3px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.06);
  --chrome:rgba(242,242,247,.72);
  /* segment fills that were raw hex */
  --seg-locked:#A6D0FF; --seg-neg:#FFDAA6; --seg-vac:#FFBAB7; --indigo:#5856D6; --purple:#AF52DE;
}
body{background:var(--bg);color:var(--ink-soft)}
.b-locked{background:var(--seg-locked)} .b-neg{background:var(--seg-neg)} .b-vac{background:var(--seg-vac)}
.d-budget{background:var(--indigo)} .d-land{background:var(--purple)}

/* Typography — optical sizing; small text gets a hair of positive tracking */
body{font-optical-sizing:auto;text-rendering:optimizeLegibility}
.eyebrow,.sub,.note,.legend,.foot,.kpi .s{letter-spacing:.01em}

/* Materials — cards float; larger surfaces read thicker */
.kpi,.pil,.stage,.xd .c,.tw,.trend,.tl,.gov,details.acc{box-shadow:var(--shadow-card)}
.verdict{box-shadow:var(--shadow-float)}

/* Translucent chrome — tabs float over content with a scroll-edge blur */
.tabs{position:sticky;top:0;z-index:10;background:var(--chrome);
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);}

/* Response — feedback on press, instant */
.tab,details.acc summary,.hdr .meta summary,button{transition:transform 100ms ease-out,color .15s}
.tab:active,details.acc summary:active,.hdr .meta summary:active,button:active{transform:scale(.97)}
details.acc summary::before{transition:transform .25s cubic-bezier(.2,.9,.3,1)}

/* Accessibility — the three independent signals */
@media (prefers-reduced-transparency:reduce){.tabs{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}}
@media (prefers-contrast:more){:root{--line:#8E8E93;--line-soft:#C7C7CC;--muted:#3C3C43}
  .tabs{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}}
@media (prefers-reduced-motion:reduce){.tab:active,details.acc summary:active,button:active{transform:none}}

@media print{.tabs{position:static;background:none;-webkit-backdrop-filter:none;backdrop-filter:none}
  .kpi,.pil,.stage,.xd .c,.tw,.trend,.tl,.gov,details.acc,.verdict{box-shadow:none!important}}
</style>

<div class="wrap">
<header class="hdr">
  <div>
    <div class="eyebrow">Ban Đầu tư · Thương mại dịch vụ · Phát triển cộng đồng — OMNI / DB Group</div>
    <h1>TMDV Điều hành</h1>
    <p class="lead" id="lead"></p>
  </div>
  <div class="meta" id="meta"></div>
</header>

<div class="tabs" role="tablist" aria-label="Chế độ xem" id="tabs"></div>
<section class="panel" id="exec" role="tabpanel" aria-labelledby="tab-exec"></section>
<section class="panel" id="ops" role="tabpanel" aria-labelledby="tab-ops" hidden></section>
<section class="panel" id="ctrl" role="tabpanel" aria-labelledby="tab-ctrl" hidden></section>

<script>
// Data lives beside the page. Opened from a local copy the relative path
// fails, so we fall back to the published copy and one file works everywhere.
const DATA_ABS = 'https://ttrng3.github.io/Omni-TMDV/data/';
let DATA_BASE = 'data/';

async function fetchJSON(u){
  const r = await fetch(u + '?t=' + Date.now(), {cache:'no-store'});
  if(!r.ok) throw new Error('HTTP ' + r.status + ' — ' + u);
  return r.json();
}
async function getJSON(p){
  try { return await fetchJSON(DATA_BASE + p); }
  catch(e){ if(DATA_BASE === DATA_ABS) throw e; DATA_BASE = DATA_ABS; return fetchJSON(DATA_BASE + p); }
}

function wireTabs(){
(function(){
  var tabs=[].slice.call(document.querySelectorAll('.tab'));
  function sel(id){
    tabs.forEach(function(t){
      var on=t.getAttribute('aria-controls')===id;
      t.setAttribute('aria-selected',on?'true':'false');
      var p=document.getElementById(t.getAttribute('aria-controls'));
      if(p) p.hidden=!on;
    });
  }
  tabs.forEach(function(t){
    t.addEventListener('click',function(){sel(t.getAttribute('aria-controls'));});
    t.addEventListener('keydown',function(e){
      var i=tabs.indexOf(t);
      if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
        e.preventDefault();
        var j=(i+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length;
        tabs[j].focus();sel(tabs[j].getAttribute('aria-controls'));
      }
    });
  });
})();
}

const TAGNAME = {v: '\u2713\u0110C', l: '~', a: 'G\u0110'};
function tag(cell){
  if (!cell || !cell.t) return '';
  const title = cell.note ? ` title="${cell.note.replace(/"/g, '&quot;')}"` : '';
  return ` <span class="pv ${cell.t}"${title}>${TAGNAME[cell.t] || cell.t}</span>`;
}
function fmt(n, unit){
  const s = Number(n).toLocaleString('vi-VN', {minimumFractionDigits: unit === '%' ? 1 : 2,
                                               maximumFractionDigits: unit === '%' ? 1 : 3});
  return unit === '%' ? s + '%' : s;
}
function renderTrend(h){
  const rows = h.series || [];
  if (rows.length < 2) return;
  const first = rows[0], last = rows[rows.length - 1];
  const span = `${first.asof} \u2192 ${last.asof}`;

  const body = (h.metrics || []).map(m => {
    const cells = rows.map((r, i) => {
      const c = r[m.key];
      return `<td class="p${i === rows.length - 1 ? ' now' : ''}">`
           + (c ? fmt(c.v, m.unit) : '\u2014') + '</td>';
    }).join('');
    const a = first[m.key], b = last[m.key];
    let delta = '<td class="d flat">\u2014</td>';
    if (a && b) {
      const diff = b.v - a.v;
      // A tag change means the basis changed. Calling that a delta would invent
      // a trend the business did not produce — the exact error this file guards.
      if (a.t !== b.t) {
        delta = `<td class="d basis" title="${(b.note || 'Cơ sở tính đổi giữa hai kỳ').replace(/"/g, '&quot;')}">đổi cơ sở</td>`;
      } else if (Math.abs(diff) < 0.005) {
        delta = '<td class="d flat">không đổi</td>';
      } else {
        delta = `<td class="d up">${diff > 0 ? '+' : ''}${fmt(diff, m.unit)}</td>`;
      }
    }
    return `<tr class="${m.lead ? 'lead' : ''}"><td class="m${m.sub ? ' sub' : ''}">${m.label}`
         + tag(last[m.key]) + `</td>${cells}${delta}</tr>`;
  }).join('');

  const head = rows.map((r, i) =>
    `<th class="num"${i === rows.length - 1 ? ' style="color:var(--accent)"' : ''}>${r.asof}</th>`).join('');

  // Sits directly under the KPI block: the board's first question after "what is
  // it?" is "which way is it going?", and that is the seam between them.
  const host = document.createElement('div');
  host.id = 'trend';
  const provkey = document.querySelector('#exec .provkey');
  if (provkey) provkey.insertAdjacentElement('afterend', host);
  else document.getElementById('exec').prepend(host);

  host.innerHTML =
    '<div class="trend">'
    + `<div class="th"><h3>Xu hướng ${rows.length} kỳ &middot; ${span}</h3>`
    + '<span class="sub">tỷ đ/năm · cột cuối = kỳ hiện hành</span></div>'
    + `<div class="tw"><table><thead><tr><th>Chỉ số</th>${head}`
    + '<th class="num">Δ</th></tr></thead><tbody>' + body + '</tbody></table></div>'
    + '<p class="tnote">Chuỗi trước 22/09 dựng lại từ bản ghi từng lần chạy trên Drive — '
    + 'mỗi dòng ghi nguồn trong <code>data/history.json</code>. "Đổi cơ sở" nghĩa là nhãn tin cậy '
    + 'giữa hai kỳ khác nhau: số đổi vì cách tính đổi, không phải vì việc kinh doanh đổi.</p>'
    + '</div>';
}

async function boot(){
  const idx = await getJSON('index.json');
  document.getElementById('lead').innerHTML = idx.lead || '';
  // idx.meta is one <br>-joined string, written by the weekly job. Line 1 (the data
  // period) stays visible; per-source freshness and the confidentiality mark fold
  // behind a disclosure so the header stops outweighing the numbers under it.
  const metaLines = (idx.meta || '').split(/<br\s*\/?>/i).filter(l => l.trim());
  document.getElementById('meta').innerHTML = metaLines.length < 2 ? (idx.meta || '')
    : `${metaLines[0]}<details><summary>nguồn &amp; mật</summary>`
      + `<div class="more">${metaLines.slice(1).join('<br>')}</div></details>`;
  document.getElementById('tabs').innerHTML = (idx.tabs || []).map((t, i) =>
    `<button class="tab" role="tab" id="tab-${t.id}" aria-selected="${i === 0}" aria-controls="${t.id}">`
    + `${t.label}<span class="hint">${t.hint}</span></button>`).join('');
  // panels load in parallel; each is its own file so a weekly refresh rewrites
  // only the one whose numbers actually moved
  const ids = Object.keys(idx.panels || {});
  const loaded = await Promise.all(ids.map(id => getJSON('panels/' + idx.panels[id] + '.json')));
  ids.forEach((id, i) => { document.getElementById(id).innerHTML = loaded[i].html; });
  // The trend is a separate file so the weekly job appends one row instead of
  // rewriting the exec panel, and so losing a panel never loses the series.
  if (idx.history) {
    try { renderTrend(await getJSON(idx.history)); }
    catch (e) { console.warn('history unavailable:', e.message); }
  }
  wireTabs();
}
boot().catch(err => {
  const m = document.getElementById('meta');
  if (m) m.innerHTML = '<b style="color:var(--critical)">Không nạp được dữ liệu:</b> '
    + (err.message || err) + ' — nguồn <code>' + DATA_BASE + 'index.json</code>';
});
</script>

<script>
(function () {
  var reopened = [];
  function expand() {
    reopened = [];
    document.querySelectorAll('details:not([open])').forEach(function (d) {
      reopened.push(d); d.open = true;
    });
  }
  function restore() {
    reopened.forEach(function (d) { d.open = false; });
    reopened = [];
  }
  window.addEventListener('beforeprint', expand);
  window.addEventListener('afterprint', restore);
  if (window.matchMedia) {
    var mq = window.matchMedia('print');
    var onChange = function (e) { e.matches ? expand() : restore(); };
    if (mq.addEventListener) { mq.addEventListener('change', onChange); }
    else if (mq.addListener) { mq.addListener(onChange); }
  }
})();
</script>
</body></html>
