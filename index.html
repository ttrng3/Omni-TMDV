<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<title>TMDV Điều hành</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Playfair+Display:wght@600;700;800&display=swap">
<style>
:root{
  --paper:#F4F3EC;--surface:#FBFAF6;--sunk:#EFEDE4;--card:#FFFFFF;
  --ink:#191D19;--ink-soft:#43483F;--muted:#77766B;
  --rule:#E3E1D6;--rule-soft:#EEEDE4;
  --accent:#0E6B50;--accent-soft:#E7F1EB;--accent-line:#B7D5C7;--accent-deep:#0A4436;
  --critical:#A8271A;--critical-soft:#F7ECE9;--critical-line:#E0B6AA;
  --warning:#8A5A00;--warning-soft:#F6EFDD;--warning-line:#E2CF9F;
  --shadow:0 1px 2px rgba(28,33,24,.05),0 8px 24px rgba(28,33,24,.06);
  --shadow-sm:0 1px 2px rgba(28,33,24,.045),0 3px 8px rgba(28,33,24,.04);
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:40px 30px 80px}
h1,h2,h3,h4{margin:0;color:var(--ink);text-wrap:balance}
h1{font-family:var(--serif);font-weight:800;font-size:37px;line-height:1.08;letter-spacing:-.01em}
h2{font-family:var(--serif);font-weight:700;font-size:23px;line-height:1.2;margin-top:56px;padding-top:20px;border-top:1px solid var(--rule);display:flex;align-items:baseline;gap:14px}
h2 .k{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--accent);font-style:italic;letter-spacing:0;line-height:1}
h3{font-family:var(--sans);font-size:15px;font-weight:600;margin-top:20px;letter-spacing:-.01em}
h4{font-family:var(--sans);font-size:14px;font-weight:600;letter-spacing:-.005em}
p{margin:10px 0;max-width:70ch}
.lead{font-size:15.5px;color:var(--ink-soft);max-width:74ch;line-height:1.62}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.hdr{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;padding-bottom:22px;border-bottom:2px solid var(--accent-deep)}
.hdr h1{margin:10px 0 10px}
.hdr .meta{font-family:var(--mono);font-size:11.5px;color:var(--muted);line-height:1.9;text-align:right;max-width:52ch}
.hdr .meta details{margin-top:2px}
.hdr .meta summary{cursor:pointer;list-style:none;color:var(--accent);font-size:11px;letter-spacing:.04em}
.hdr .meta summary::-webkit-details-marker{display:none}
.hdr .meta summary::after{content:" +"}
.hdr .meta details[open] summary::after{content:" \2013"}
.hdr .meta .more{margin-top:6px;padding-top:7px;border-top:1px solid var(--rule);line-height:1.75}
.num,.n{font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;margin:26px 0 0;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;padding:12px 18px 13px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;margin-bottom:-1px;transition:color .15s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.tab .hint{display:block;font-weight:400;font-size:11.5px;color:var(--muted);margin-top:2px}
.panel{padding-top:4px}
.verdict{margin:32px 0 6px;padding:26px 30px;border:1px solid var(--rule);border-left:4px solid var(--accent);background:var(--card);border-radius:6px;box-shadow:var(--shadow)}
.verdict h2{font-family:var(--serif);border:0;margin:0;padding:0;font-size:24px;line-height:1.28;font-weight:700;display:block}
.verdict p{max-width:none;color:var(--ink-soft);margin:14px 0 0;font-size:14.5px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:26px}
.kpi{padding:20px 20px 18px;background:var(--card);border:1px solid var(--rule);border-top:3px solid var(--accent-line);border-radius:6px;box-shadow:var(--shadow-sm)}
.kpi .v{font-family:var(--serif);font-size:32px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .l{font-size:12.5px;color:var(--ink-soft);margin-top:10px;line-height:1.45}
.kpi .s{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:9px;line-height:1.6}
.kpi.crit{border-top-color:var(--critical)}.kpi.crit .v{color:var(--critical)}
.kpi.warn{border-top-color:var(--warning)}.kpi.warn .v{color:var(--warning)}
/* .pv.pv, not .pv: the tags are written class="pv v" / "pv l" / "pv a", and inside a
   KPI card `.kpi .v` and `.kpi .l` would otherwise win on specificity and render a
   9.5px mono tag as a 32px Playfair headline. Do not simplify these back to .pv. */
.pv.pv{font-family:var(--mono);font-size:9.5px;font-weight:500;padding:1px 4px;border-radius:2px;border:1px solid var(--rule);vertical-align:1px;white-space:nowrap;margin-left:3px;color:var(--muted);line-height:1.4;letter-spacing:0}
.pv.pv.v{color:var(--accent);border-color:var(--accent-line)}
.pv.pv.a{color:var(--warning);border-color:var(--warning-line)}
.pv.pv.l{color:var(--muted)}
.provkey{display:flex;flex-wrap:wrap;gap:16px;margin-top:14px;font-size:11.5px;color:var(--muted)}
/* Trend strip. Deliberately a TABLE, not a sparkline: across the five recovered
   periods pct/collected/vinh/longan vary by under 0.2% — they are flat lines —
   and the only metric that moves (committed, 10.6%) moves because its basis
   changed, not because the business did. Sparklines here would draw four dead
   lines and one fake step. If real variance ever appears, revisit; until then a
   table with an explicit delta is the honest form. */
.trend{margin-top:26px;border:1px solid var(--rule);border-radius:6px;background:var(--card);box-shadow:var(--shadow-sm);overflow:hidden}
.trend .th{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:13px 18px 11px;border-bottom:1px solid var(--rule-soft);flex-wrap:wrap}
.trend .th h3{font-size:13.5px;margin:0}
.trend .th .sub{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.trend table{font-size:12.5px}
.trend th,.trend td{padding:7px 12px;border-bottom:1px solid var(--rule-soft)}
.trend th{background:var(--surface);font-size:10px}
.trend td.m{color:var(--ink-soft);white-space:nowrap}
.trend td.m.sub{padding-left:24px;color:var(--muted);font-size:12px}
.trend tr.lead td{font-weight:600;color:var(--ink)}
.trend td.p{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.trend td.now{background:var(--accent-soft)}
.trend td.d{text-align:right;font-family:var(--mono);font-weight:600;white-space:nowrap}
.trend td.d.flat{color:var(--muted)}
.trend td.d.up{color:var(--accent)}
.trend td.d.basis{color:var(--warning)}
.trend .foot{padding:11px 18px 13px;font-size:11.5px;color:var(--muted);line-height:1.6}
/* Instrument trust — distinct from the risk map. The risk map is about the
   business; this is about whether the numbers on this page can be relied on. */
.unsafe{margin-top:22px;border:1px solid var(--critical-line);border-left:4px solid var(--critical);border-radius:6px;background:var(--critical-soft);padding:16px 20px 14px}
.unsafe h3{font-size:13px;margin:0 0 4px;color:var(--critical)}
.unsafe ol{margin:8px 0 0;padding-left:20px}
.unsafe li{font-size:13px;color:var(--ink-soft);margin:6px 0;line-height:1.55}
.unsafe .where{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:4px}
.pillars{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:20px}
.pil{border:1px solid var(--rule);background:var(--card);padding:20px 22px;border-radius:6px;box-shadow:var(--shadow-sm)}
.pil .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pil h3{margin:0;font-size:14.5px;font-weight:600}
.pil .tag{font-family:var(--mono);font-size:11px;color:var(--muted)}
.pil .big{font-family:var(--serif);font-size:27px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:10px;letter-spacing:-.01em}
.pil .big small{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400;letter-spacing:0}
.pil ul{margin:14px 0 0;padding-left:16px}
.pil li{margin:7px 0;font-size:13px;color:var(--ink-soft)}
.pil .fresh{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:14px;padding-top:11px;border-top:1px solid var(--rule-soft)}
.pil.crit{border-top:3px solid var(--critical)}.pil.warn{border-top:3px solid var(--warning)}.pil.ok{border-top:3px solid var(--accent)}
.barrow{margin-top:18px}
.barrow .lab{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;color:var(--ink-soft)}
.bar{display:flex;height:32px;border:1px solid var(--rule);border-radius:4px;overflow:hidden;box-shadow:var(--shadow-sm)}
.seg{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10.5px;color:var(--ink);overflow:hidden;border-right:1px solid #fff}
.seg span{white-space:nowrap}
.b-live{background:#0E6B50;color:#fff}.b-int{background:#D6DDD4}.b-signed{background:#AECFBF}.b-locked{background:#D3E4DA}.b-neg{background:#ECE3C4}.b-vac{background:#EFD8D2}
.b-live span{color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:13px;font-size:11.5px;color:var(--muted)}
.lg{display:inline-flex;align-items:center;gap:6px}.sw{width:11px;height:11px;border:1px solid var(--rule);display:inline-block;border-radius:2px}
.stages{display:grid;grid-template-columns:repeat(6,1fr);gap:11px;margin-top:16px}
.stage{border:1px solid var(--rule);padding:13px 14px;background:var(--card);border-radius:5px;box-shadow:var(--shadow-sm)}
.stage .t{font-weight:600;font-size:13px}
.stage .d{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.4}
.stage .c{font-family:var(--mono);font-size:11.5px;margin-top:10px;color:var(--ink-soft);line-height:1.6}
.stage.hi{border-color:var(--critical-line)}
.tw{overflow-x:auto;margin-top:16px;border:1px solid var(--rule);border-radius:6px;box-shadow:var(--shadow-sm)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:10px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--rule-soft)}
th{background:var(--surface);font-weight:600;font-size:11px;color:var(--muted);white-space:nowrap;text-transform:uppercase;letter-spacing:.05em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
.sub{font-size:11.5px;color:var(--muted);margin-top:3px}
td.proj{white-space:nowrap;font-family:var(--mono);font-size:12px}
td.risk{min-width:300px}
.pill{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border:1px solid var(--rule);border-radius:10px;white-space:nowrap}
.st-crit{color:var(--critical);border-color:var(--critical-line);background:var(--critical-soft)}
.st-warn{color:var(--warning);border-color:var(--warning-line);background:var(--warning-soft)}
.st-ok{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.st-neg{color:var(--ink-soft)}.st-info{color:var(--muted)}
.dl-over{color:var(--critical);font-weight:600}
.trend td.flat{color:var(--muted)}
.xd{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.xd .c{border:1px solid var(--rule);padding:20px 22px;border-radius:6px;background:var(--card);box-shadow:var(--shadow-sm)}
.xd .c .money{font-family:var(--serif);font-size:23px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.xd .c .money small{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:8px;font-weight:400;letter-spacing:0}
.xd .c h4{margin-top:10px;font-size:14.5px}
.xd .c p{font-size:13px;max-width:none;color:var(--ink-soft);margin:8px 0 0}
.owner{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:12px}
.sev{font-family:var(--mono);font-size:10.5px;font-weight:600}
.sev.h{color:var(--critical)}.sev.m{color:var(--warning)}
details.acc{border:1px solid var(--rule);margin-top:14px;background:var(--card);border-radius:6px;box-shadow:var(--shadow-sm)}
details.acc summary{cursor:pointer;padding:15px 20px;font-weight:600;font-size:14px;list-style:none;display:flex;justify-content:space-between;gap:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary .r{font-weight:400;color:var(--muted);font-size:11.5px;font-family:var(--mono)}
details.acc summary::before{content:"+";font-family:var(--mono);color:var(--accent);margin-right:10px;font-weight:500}
details.acc[open] summary::before{content:"\2013"}
details.acc[open] summary{border-bottom:1px solid var(--rule-soft)}
details.acc .body{padding:16px 20px 20px}
details.acc .body .tw{border:1px solid var(--rule);box-shadow:none}
.note{font-size:12px;color:var(--muted);margin-top:11px;max-width:80ch;line-height:1.65}
.callout{border:1px solid var(--rule);border-left:4px solid var(--warning);padding:14px 18px;margin-top:16px;background:var(--surface);border-radius:5px}
.callout.crit{border-left-color:var(--critical)}
.callout.ok{border-left-color:var(--accent)}
.callout p{max-width:none;margin:4px 0;font-size:13px}
.tl{margin-top:20px;border-left:1px solid var(--rule);padding-left:0}
.tlrow{display:grid;grid-template-columns:82px 14px 1fr;gap:12px;padding:11px 0;border-bottom:1px solid var(--rule-soft)}
.tlrow:last-child{border-bottom:0}
.tlrow .dt{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:right;padding-right:4px}
.tlrow .dot{width:9px;height:9px;border-radius:50%;margin-top:5px;margin-left:-5px;border:2px solid var(--card)}
.tlrow .body{font-size:13px;color:var(--ink-soft)}
.tlrow .body .cat{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-left:8px}
.d-legal{background:var(--critical)}.d-recover{background:#C2410C}.d-lease{background:var(--accent)}.d-otl{background:#2563A8}.d-policy{background:var(--muted)}.d-budget{background:var(--warning)}.d-land{background:#6D28A8}
.tlkey{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;font-size:11px;color:var(--muted)}
.tlkey .lg .sw{border-radius:50%;width:9px;height:9px}
.gov{display:grid;grid-template-columns:1fr;margin-top:16px;border:1px solid var(--rule);border-radius:6px;overflow:hidden;box-shadow:var(--shadow-sm);background:var(--card)}
.govrow{display:grid;grid-template-columns:200px 96px 1fr;gap:14px;padding:14px 18px;border-bottom:1px solid var(--rule-soft);align-items:baseline}
.govrow:last-child{border-bottom:0}
.govrow .g-name{font-weight:600;font-size:13px}
.govrow .g-txt{font-size:12.5px;color:var(--ink-soft)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px}
.foot{margin-top:56px;padding-top:18px;border-top:2px solid var(--accent-deep);font-size:11.5px;color:var(--muted)}
.foot p{max-width:none;line-height:1.7}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.pillars,.xd,.two{grid-template-columns:1fr}.stages{grid-template-columns:repeat(3,1fr)}.hdr .meta{text-align:left}.govrow{grid-template-columns:1fr;gap:4px}}
@media (max-width:560px){.kpis{grid-template-columns:1fr}.stages{grid-template-columns:1fr}.tlrow{grid-template-columns:66px 14px 1fr};h1{font-size:30px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  body{background:#fff}
  :root{--muted:#333;--ink-soft:#222;--paper:#fff;--shadow:none;--shadow-sm:none}
  .verdict,.kpi,.pil,.stage,.tw,.xd .c,details.acc,.gov,.bar{box-shadow:none!important}
  .tabs{display:none}
  .hdr .meta details{display:block}
  .hdr .meta summary{display:none}
  .hdr .meta .more{display:block!important}
  .panel[hidden]{display:block!important}
  .kpi,.stage,.pil,.xd .c,details.acc,.callout,.verdict,.tlrow,.govrow,tr,.trend,.unsafe{break-inside:avoid}
  .kpi,.stage,.pil,.xd .c,.callout,.verdict,th{background:#fff!important}
  details.acc{border:1px solid #999}
  details.acc summary::before{content:""}
  .seg,.dot,.b-live,.b-int,.b-signed,.b-locked,.b-neg,.b-vac,.d-legal,.d-recover,.d-lease,.d-otl,.d-policy,.d-budget,.d-land{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  a{color:inherit;text-decoration:none}
  .wrap{padding:0;max-width:none}
}
</style>

<div class="wrap">
<header class="hdr">
  <div>
    <div class="eyebrow">Ban Đầu tư · Thương mại dịch vụ · Phát triển cộng đồng — OMNI / DB Group</div>
    <h1>TMDV Điều hành</h1>
    <p class="lead" id="lead"></p>
  </div>
  <div class="meta" id="meta"></div>
</header>

<div class="tabs" role="tablist" aria-label="Chế độ xem" id="tabs"></div>
<section class="panel" id="exec" role="tabpanel" aria-labelledby="tab-exec"></section>
<section class="panel" id="ops" role="tabpanel" aria-labelledby="tab-ops" hidden></section>
<section class="panel" id="ctrl" role="tabpanel" aria-labelledby="tab-ctrl" hidden></section>

<script>
// Data lives beside the page. Opened from anywhere else (a claude.ai artifact,
// a local copy) the relative path fails and we fall back to the published copy,
// so one file works everywhere.
const DATA_ABS = 'https://ttrng3.github.io/Omni-TMDV/data/';
let DATA_BASE = 'data/';

async function fetchJSON(u){
  const r = await fetch(u + '?t=' + Date.now(), {cache:'no-store'});
  if(!r.ok) throw new Error('HTTP ' + r.status + ' — ' + u);
  return r.json();
}
async function getJSON(p){
  try { return await fetchJSON(DATA_BASE + p); }
  catch(e){ if(DATA_BASE === DATA_ABS) throw e; DATA_BASE = DATA_ABS; return fetchJSON(DATA_BASE + p); }
}

function wireTabs(){
(function(){
  var tabs=[].slice.call(document.querySelectorAll('.tab'));
  function sel(id){
    tabs.forEach(function(t){
      var on=t.getAttribute('aria-controls')===id;
      t.setAttribute('aria-selected',on?'true':'false');
      var p=document.getElementById(t.getAttribute('aria-controls'));
      if(p) p.hidden=!on;
    });
  }
  tabs.forEach(function(t){
    t.addEventListener('click',function(){sel(t.getAttribute('aria-controls'));});
    t.addEventListener('keydown',function(e){
      var i=tabs.indexOf(t);
      if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
        e.preventDefault();
        var j=(i+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length;
        tabs[j].focus();sel(tabs[j].getAttribute('aria-controls'));
      }
    });
  });
})();
}

const TAGNAME = {v: '\u2713\u0110C', l: '~', a: 'G\u0110'};
function tag(cell){
  if (!cell || !cell.t) return '';
  const title = cell.note ? ` title="${cell.note.replace(/"/g, '&quot;')}"` : '';
  return ` <span class="pv ${cell.t}"${title}>${TAGNAME[cell.t] || cell.t}</span>`;
}
function fmt(n, unit){
  const s = Number(n).toLocaleString('vi-VN', {minimumFractionDigits: unit === '%' ? 1 : 2,
                                               maximumFractionDigits: unit === '%' ? 1 : 3});
  return unit === '%' ? s + '%' : s;
}
function renderTrend(h){
  const rows = h.series || [];
  if (rows.length < 2) return;
  const first = rows[0], last = rows[rows.length - 1];
  const span = `${first.asof} \u2192 ${last.asof}`;

  const body = (h.metrics || []).map(m => {
    const cells = rows.map((r, i) => {
      const c = r[m.key];
      return `<td class="p${i === rows.length - 1 ? ' now' : ''}">`
           + (c ? fmt(c.v, m.unit) : '\u2014') + '</td>';
    }).join('');
    const a = first[m.key], b = last[m.key];
    let delta = '<td class="d flat">\u2014</td>';
    if (a && b) {
      const diff = b.v - a.v;
      // A tag change means the basis changed. Calling that a delta would invent
      // a trend the business did not produce — the exact error this file guards.
      if (a.t !== b.t) {
        delta = `<td class="d basis" title="${(b.note || 'Cơ sở tính đổi giữa hai kỳ').replace(/"/g, '&quot;')}">đổi cơ sở</td>`;
      } else if (Math.abs(diff) < 0.005) {
        delta = '<td class="d flat">không đổi</td>';
      } else {
        delta = `<td class="d up">${diff > 0 ? '+' : ''}${fmt(diff, m.unit)}</td>`;
      }
    }
    return `<tr class="${m.lead ? 'lead' : ''}"><td class="m${m.sub ? ' sub' : ''}">${m.label}`
         + tag(last[m.key]) + `</td>${cells}${delta}</tr>`;
  }).join('');

  const head = rows.map((r, i) =>
    `<th class="num"${i === rows.length - 1 ? ' style="color:var(--accent)"' : ''}>${r.asof}</th>`).join('');

  // Sits directly under the KPI block: the board's first question after "what is
  // it?" is "which way is it going?", and that is the seam between them.
  const host = document.createElement('div');
  host.id = 'trend';
  const provkey = document.querySelector('#exec .provkey');
  if (provkey) provkey.insertAdjacentElement('afterend', host);
  else document.getElementById('exec').prepend(host);

  host.innerHTML =
    '<div class="trend">'
    + `<div class="th"><h3>Xu hướng ${rows.length} kỳ &middot; ${span}</h3>`
    + '<span class="sub">tỷ đ/năm · cột cuối = kỳ hiện hành</span></div>'
    + `<div class="tw" style="margin:0;border:0;box-shadow:none"><table><thead><tr><th>Chỉ số</th>${head}`
    + '<th class="num">Δ</th></tr></thead><tbody>' + body + '</tbody></table></div>'
    + '<p class="foot">Chuỗi trước 22/09 dựng lại từ bản ghi từng lần chạy trên Drive — '
    + 'mỗi dòng ghi nguồn trong <code>data/history.json</code>. "Đổi cơ sở" nghĩa là nhãn tin cậy '
    + 'giữa hai kỳ khác nhau: số đổi vì cách tính đổi, không phải vì việc kinh doanh đổi.</p>'
    + '</div>';
}

async function boot(){
  const idx = await getJSON('index.json');
  document.getElementById('lead').innerHTML = idx.lead || '';
  // idx.meta is one <br>-joined string, written by the weekly job. Line 1 (the data
  // period) stays visible; per-source freshness and the confidentiality mark fold
  // behind a disclosure so the header stops outweighing the numbers under it.
  const metaLines = (idx.meta || '').split(/<br\s*\/?>/i).filter(l => l.trim());
  document.getElementById('meta').innerHTML = metaLines.length < 2 ? (idx.meta || '')
    : `${metaLines[0]}<details><summary>nguồn &amp; mật</summary>`
      + `<div class="more">${metaLines.slice(1).join('<br>')}</div></details>`;
  document.getElementById('tabs').innerHTML = (idx.tabs || []).map((t, i) =>
    `<button class="tab" role="tab" id="tab-${t.id}" aria-selected="${i === 0}" aria-controls="${t.id}">`
    + `${t.label}<span class="hint">${t.hint}</span></button>`).join('');
  // panels load in parallel; each is its own file so a weekly refresh rewrites
  // only the one whose numbers actually moved
  const ids = Object.keys(idx.panels || {});
  const loaded = await Promise.all(ids.map(id => getJSON('panels/' + idx.panels[id] + '.json')));
  ids.forEach((id, i) => { document.getElementById(id).innerHTML = loaded[i].html; });
  // The trend is a separate file so the weekly job appends one row instead of
  // rewriting the exec panel, and so losing a panel never loses the series.
  if (idx.history) {
    try { renderTrend(await getJSON(idx.history)); }
    catch (e) { console.warn('history unavailable:', e.message); }
  }
  wireTabs();
}
boot().catch(err => {
  const m = document.getElementById('meta');
  if (m) m.innerHTML = '<b style="color:var(--critical)">Không nạp được dữ liệu:</b> '
    + (err.message || err) + ' — nguồn <code>' + DATA_BASE + 'index.json</code>';
});
</script>
</body></html>
